<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Blocking on purpose: marks JS as available before first paint so scroll-reveal
         animations (see index.css) only run for clients that can actually run them. -->
    <script>document.documentElement.classList.add('js-animations')</script>

    <!-- Primary Meta Tags -->
    <title>%SITE_TITLE%</title>
    <meta name="title" content="%SITE_TITLE%" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="keywords" content="React developer, .NET developer, TypeScript, ASP.NET Core developer, offline-first PWA developer, full stack developer Cape Town, React developer South Africa" />
    <meta name="author" content="Andile Khumalo" />
    <meta name="theme-color" content="#0E1916" />

    <!-- Inter is self-hosted (@fontsource-variable/inter, imported in main.tsx) — no external font requests -->
    <meta name="color-scheme" content="dark light" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="profile" />
    <meta property="profile:first_name" content="Andile" />
    <meta property="profile:last_name" content="Khumalo" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Andile Khumalo" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "mainEntity": {
        "@type": "Person",
        "name": "Andile Khumalo",
        "url": "%VITE_SITE_URL%",
        "email": "d.langelihlekhumalo@gmail.com",
        "jobTitle": "%JSONLD_JOB_TITLE%",
        "image": "%VITE_SITE_URL%/og-image.png",
        "description": "%JSONLD_DESCRIPTION%",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cape Town",
          "addressCountry": "ZA"
        },
        "knowsAbout": [
          "Full Stack Development",
          ".NET",
          "ASP.NET Core",
          "C#",
          "React",
          "TypeScript",
          "JavaScript",
          "REST API Design",
          "Offline-First PWAs",
          "SQL Server",
          "PostgreSQL"
        ],
        "knowsLanguage": ["en"],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Mangosuthu University of Technology"
        },
        "worksFor": {
          "@type": "Organization",
          "name": "Advania SA"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Build your first version" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Make your web app work offline" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Fix and speed up an existing React app" } }
        ],
        "sameAs": [
          "https://github.com/d-langelihlekhumalo",
          "https://linkedin.com/in/andile-khumalo-1087441b7"
        ]
      }
    }
    </script>

    <!-- Robots Meta -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Additional Meta Tags -->
    <meta name="language" content="English" />

    <!-- Microsoft Clarity — skipped for automated/headless browsers (navigator.webdriver),
         so the build's own prerender pass and any Playwright QA runs don't get recorded
         as real visits. -->
    <script>
      if (!navigator.webdriver) {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "ym8u7cuji4");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
