<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --paper: #f6f6f2;
        --ink: #16191d;
        --muted: #565d66;
        --protea: #a3305c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background: var(--paper);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 96px;
      }
      .accent {
        width: 64px;
        height: 8px;
        border-radius: 4px;
        background: var(--protea);
        margin-bottom: 40px;
      }
      h1 {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--ink);
        margin-bottom: 28px;
      }
      p.headline {
        font-size: 32px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--ink);
        max-width: 920px;
      }
      p.tagline {
        margin-top: 32px;
        font-size: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="accent"></div>
    <h1>__NAME__</h1>
    <p class="headline">__HEADLINE__</p>
    <p class="tagline">__TAGLINE__</p>
  </body>
</html>
